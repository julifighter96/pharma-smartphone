<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <!-- iPhone / PWA optimisation -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PharmaApp">
  <meta name="theme-color" content="#F57C00">
  <meta name="mobile-web-app-capable" content="yes">

  <title>PharmaApp CRM</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Material Symbols Rounded + Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">

  <!-- ── TOP BAR ────────────────────────────────────────── -->
  <header id="topbar">
    <button id="back-btn" class="ibtn hidden" onclick="App.goBack()" title="Zurück">
      <span class="mi">arrow_back</span>
    </button>
    <div id="topbar-title">PharmaApp</div>
    <div id="topbar-actions">
      <button class="ibtn" onclick="App.toggleSearch()" title="Suchen">
        <span class="mi">search</span>
      </button>
      <button class="ibtn" onclick="App.showProfile()" title="Profil">
        <span class="mi">account_circle</span>
      </button>
    </div>
  </header>

  <!-- ── SEARCH BAR ─────────────────────────────────────── -->
  <div id="searchbar" class="hidden">
    <div class="search-wrap">
      <span class="mi">search</span>
      <input type="search"
        placeholder="Kunde, Fachrichtung, Adresse …"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        oninput="App.handleSearch(this.value)">
      <button class="ibtn ibtn--surface" onclick="App.closeSearch()">
        <span class="mi">close</span>
      </button>
    </div>
  </div>

  <!-- ── MAIN CONTENT ───────────────────────────────────── -->
  <main id="main">
    <!-- views rendered by JS -->
  </main>

  <!-- ── BOTTOM NAVIGATION ─────────────────────────────── -->
  <nav id="bottomnav">
    <button class="bnav-item active" data-view="today" onclick="App.navigate('today')">
      <div class="bnav-indicator"></div>
      <span class="mi">today</span>
      <span class="bnav-label">Heute</span>
    </button>
    <button class="bnav-item" data-view="customers" onclick="App.navigate('customers')">
      <div class="bnav-indicator"></div>
      <span class="mi">people</span>
      <span class="bnav-label">Kunden</span>
    </button>
    <button class="bnav-item" data-view="map" onclick="App.navigate('map')">
      <div class="bnav-indicator"></div>
      <span class="mi">map</span>
      <span class="bnav-label">Karte</span>
    </button>
    <button class="bnav-item" data-view="nearby" onclick="App.navigate('nearby')">
      <div class="bnav-indicator"></div>
      <span class="mi">near_me</span>
      <span class="bnav-label">In der Nähe</span>
    </button>
  </nav>

  <!-- ── FAB ───────────────────────────────────────────── -->
  <button id="fab" onclick="App.fabAction()" title="Hinzufügen">
    <span class="mi">add</span>
  </button>

</div><!-- #app -->

<!-- ── BOTTOM SHEET OVERLAY ──────────────────────────────── -->
<div id="overlay" class="hidden" onclick="App.closeSheet()"></div>
<div id="sheet" class="modal-sheet hidden"></div>

<!-- ── TOAST ─────────────────────────────────────────────── -->
<div id="toast-wrap"></div>

<!-- Scripts -->
<script src="js/data.js"></script>
<script src="js/app.js"></script>

<!--
  ╔══════════════════════════════════════════════════════════╗
  ║  GOOGLE MAPS API-KEY                                     ║
  ║  Ersetze YOUR_GOOGLE_MAPS_API_KEY mit deinem echten Key  ║
  ║  aus https://console.cloud.google.com                    ║
  ║  Benötigte API: Maps JavaScript API                      ║
  ╚══════════════════════════════════════════════════════════╝
-->
<script
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCyjqQ1A0UgcPdFJkjSspa2Y8l6_nMDjxc&callback=App.initMap&libraries=marker&loading=async"
  async defer
  onerror="console.warn('Google Maps API nicht geladen – API-Key prüfen.')">
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>
